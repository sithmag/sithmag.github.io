<head>
{% include head.html %}

<script src="https://cdn.counter.dev/script.js" data-id="4c8f7caa-2b55-46cd-a995-2c4633303773" data-utcoffset="8"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N5JY1E21"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-T5N5JY1E21');
</script>

</head>


<body class="page {{ page.body_class }}" itemscope itemtype="http://schema.org/WebPage">

{% include chrome-frame.html %}

{% include navigation.html %}

{% if page.image.feature %}<div class="image-wrap">
  <img src="{{ site.url }}/images/{{ page.image.feature }}" alt="{{ page.title }} feature image" itemprop="primaryImageOfPage">
</div><!-- /.image-wrap -->{% endif %}

<div id="main" role="main"  itemprop="mainContentOfPage">
  <div class="article-author-top">
    {% include author-bio.html %}
  </div>
  <article itemscope itemtype="http://schema.org/CreativeWork">
  {% comment %}
    <div class="headline-wrap">
      <h1 itemprop="headline">{{ page.title }}</h1>
    </div><!--/ .headline-wrap -->
  {% endcomment %}
    <div class="article-wrap" itemprop="text">
      {{ content }}
    </div><!-- /.article-wrap -->
  </article>
</div><!-- /#index -->

<div class="footer-wrap">
  <footer>
    {% include footer.html %}
  </footer>
</div><!-- /.footer-wrap -->

{% include scripts.html %}

<!-- Portfolio visitor Telegram notifier -->
<script>
(function () {
  try {
    if (sessionStorage.getItem("portfolioVisitPinged")) return;
    sessionStorage.setItem("portfolioVisitPinged", "1");

    const payload = {
      key: "saveenda",
      page: window.location.pathname + window.location.search,
      title: document.title,
      referrer: document.referrer || "",
      device: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
      language: navigator.language || ""
    };

    fetch("https://script.google.com/macros/s/AKfycbyo7r2Fhl-7eixqMNPoCIkdyFjOJM-097I34NFqymBJrDtnqvxgcrnnuwwnJ8nB1C_6OQ/exec", {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload),
      keepalive: true
    });
  } catch (error) {
    // Silently fail so the portfolio never breaks.
  }
})();
</script>

</body>
</html>
