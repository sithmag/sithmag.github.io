<div class="navigation-wrapper">
  <div class="site-name">
    <a href="{{ site.url }}" class="site-name-link">
      <img
        src="/assets/images/header-profile.jpg"
        alt="Sithma Gunawardena profile icon"
        class="header-profile-icon">
      <span>{{ site.title }}</span>
    </a>
  </div><!-- /.site-name -->

  {% capture url %}{{ page.url | remove:'index.html' }}{% endcapture %}

  <div class="top-navigation">
    <nav role="navigation" itemscope itemtype="http://schema.org/SiteNavigationElement">
      <ul>
        {% for link in site.links %}
          <li>
            <a href="{{ site.url }}{{ link.url }}" {% if url == link.url %}class="top-navigation-current"{% endif %}>
              {{ link.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div><!-- /.top-navigation -->
</div><!-- /.navigation-wrapper -->
